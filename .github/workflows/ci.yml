name : CI 


on :
    pull_request:
      branches:
        -dev


jobs:
  build:
    runs-on: ubuntu-latest


    steps:

      - name: Checkout code
        uses: actions/checkout@v3


      - name: Setup Node.js
        uses: actions/setup-node@v3
        with: 
          node-version: 18

      - name: Install dependencies
        run: cd frontend && npm install


      - name: Run lint 
        run: cd frontend && npm run linit


      - name: Run build
        run: cd frontend && npm run build
